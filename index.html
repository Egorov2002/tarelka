<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Тарелка — умный рацион на неделю</title>
<meta name="description" content="Рацион на неделю по ценам твоего магазина: меню, список покупок и рецепты. Считаем всё сразу, без подписки и доплат.">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тарелка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="phone">

  <header class="appbar" id="appbar">
    <div class="appbar__row">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 11h18a9 9 0 0 1-18 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 20h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 7c0-1.5 1-2 1-3M13 7c0-1.5 1-2 1-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__name">Тарелка</span>
      </div>
      <button class="appbar__pill" id="storePill" type="button" aria-label="Магазин и бюджет">
        <span id="storePillName">Магнит</span>
        <span class="appbar__pill-sep"></span>
        <span id="storePillBudget">0 ₽</span>
      </button>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Основная навигация">
    <button class="tab" data-tab="plan" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Рацион</span>
    </button>
    <button class="tab" data-tab="list" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h2.2M4 12h2.2M4 17.5h2.2M9.5 6.5H20M9.5 12H20M9.5 17.5H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Список</span>
      <span class="tab__badge" id="listBadge" hidden></span>
    </button>
    <button class="tab" data-tab="dishes" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3v7a3 3 0 0 0 6 0V3M10 10v11M17 3c-1.5 2.5-2 5-2 7.5S16 15 16 15v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Блюда</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 14a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 14a1.6 1.6 0 0 0-1.47-.97H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 8a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6h.08A1.6 1.6 0 0 0 10 3.13V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 8v.08a1.6 1.6 0 0 0 1.47.97H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.47.97Z" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Настройки</span>
    </button>
  </nav>

</div>

<div class="sheet-root" id="sheetRoot" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <button class="sheet__close" type="button" data-close="1" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
